name: Docs (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "cpp/**"
      - "java/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deploy:
    name: Build mkdocs and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # mkdocs git-revision-date plugin needs history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mkdocs-material
        run: pip install -r docs/requirements.txt
      - name: Build site
        run: mkdocs build --strict
      # Deploy only runs when the Cloudflare secrets are present, so forks and
      # PRs (which cannot read secrets) build-and-verify without failing.
      - name: Deploy to Cloudflare Pages
        if: ${{ github.ref == 'refs/heads/main' && env.CF_API_TOKEN != '' }}
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=hackerrank-problems
